name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    attributes:
      label: Hext version and Windows build
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant details
      description: Include display scale, monitor arrangement, or audio device when relevant. Remove personal data from screenshots and logs.
