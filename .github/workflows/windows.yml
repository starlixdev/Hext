name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Add compiler to PATH
        run: '"${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8'
      - name: Build
        run: ./app/build.ps1 -Preview
      - name: Test
        run: ./scripts/test.ps1
      - name: Verify native renderer
        run: |
          $taskVerify = Start-Process app/dist/Hext-preview.exe -ArgumentList '--verify-render' -WindowStyle Hidden -PassThru
          if (-not $taskVerify.WaitForExit(90000)) { throw 'Renderer verification timed out' }
          Get-Content app/dist/verification.txt
          if ($taskVerify.ExitCode -ne 0) { throw 'Renderer verification failed' }
      - name: Package clean application
        # Account-dependent integrations are opt-in local tests, never simulated in CI.
        run: ./scripts/package.ps1
      - name: Verify personal assistant controller and renderer
        run: |
          $taskVerify = Start-Process app/dist/Hext-preview.exe -ArgumentList '--verify-personal' -WindowStyle Hidden -PassThru
          if (-not $taskVerify.WaitForExit(90000)) { throw 'Personal assistant verification timed out' }
          Get-Content app/dist/personal-verification.txt
          if ($taskVerify.ExitCode -ne 0) { throw 'Personal assistant verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Hext-Windows-x64
          path: |
            release/Hext-Windows-x64.zip
            release/SHA256SUMS.txt
            app/dist/verification.txt
            app/dist/personal-verification.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            app/dist/verification.txt
            app/dist/personal-verification.txt
          if-no-files-found: ignore
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hext-Windows-x64
          path: release/app
      - name: Publish application
        run: |
          $taskVersion = (Get-Content VERSION -Raw).Trim()
          gh release view "v$taskVersion" --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            $taskAssets = Get-ChildItem release/app -Recurse -File | Where-Object {$_.Name -in @('Hext-Windows-x64.zip','SHA256SUMS.txt')}
            if ($taskAssets.Count -ne 2) { throw 'Release assets are missing' }
            $taskNotes = "Added a general Windows agent layer: isolated PowerShell in per-conversation AppContainers, public HTTPS research, individually authorized UI Automation, reviewed WinGet package proposals and durable encrypted task checkpoints. Tasks can combine tools and resume after user participation without repeating the original request. Native permission gates, conversations, memory and island behavior remain in use. See docs/agent.md and docs/verification-0.10.0.md for real Codex/native tests and remaining installation/account/browser limits."
            gh release create "v$taskVersion" $taskAssets.FullName --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Hext $taskVersion" --notes $taskNotes --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish Hext' }
          }
